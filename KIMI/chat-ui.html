<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi K3 Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f7f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .model-badge {
      background: #f0f0f0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #666;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .message {
      display: flex;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .message.assistant .avatar { background: #10a37f; color: white; }
    .message.user .avatar { background: #f0f0f0; color: #1a1a1a; }
    .message-content {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
    }
    .message.assistant .message-content {
      background: white;
      border: 1px solid #e5e5e5;
    }
    .message.user .message-content {
      background: #1a1a1a;
      color: white;
      border-radius: 12px 12px 0 12px;
    }
    .message.user .message-content { border-radius: 12px 12px 12px 0; }
    .reasoning {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    .reasoning-toggle {
      cursor: pointer;
      color: #10a37f;
      font-size: 12px;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .input-area {
      background: white;
      border-top: 1px solid #e5e5e5;
      padding: 16px 24px;
    }
    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-container {
      flex: 1;
      position: relative;
    }
    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 200px;
      padding: 12px 48px 12px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    textarea:focus { border-color: #10a37f; }
    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #10a37f;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #0d8a6b; }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; }
    .loading { display: inline-flex; gap: 4px; }
    .loading span {
      width: 6px; height: 6px; background: #999;
      border-radius: 50%; animation: bounce 1s infinite ease-in-out;
    }
    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .error-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4444;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 100;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    code { font-family: monospace; }
    pre code { background: none; padding: 0; }
    .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: 16px 0 8px; }
    .markdown-content p { margin: 8px 0; }
    .markdown-content ul, .markdown-content ol { margin: 8px 0; padding-left: 24px; }
    .markdown-content blockquote { border-left: 3px solid #10a37f; padding-left: 12px; color: #666; margin: 8px 0; }
    .markdown-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .markdown-content th, .markdown-content td { border: 1px solid #eee; padding: 8px 12px; text-align: left; }
    .markdown-content th { background: #f5f5f5; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Kimi K3</h1>
    <span class="model-badge">moonshotai/kimi-k3 via OpenRouter</span>
  </header>
  <div class="chat-container" id="chatContainer"></div>
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-container">
        <textarea id="input" placeholder="Message Kimi K3..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
  <script>
    const API_KEY = ''; // Set via environment or config
    const MODEL = 'moonshotai/kimi-k3';
    const API_URL = 'https://openrouter.ai/api/v1/chat/completions';

    const chatContainer = document.getElementById('chatContainer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    let messages = [];
    let isLoading = false;

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }

    input.addEventListener('input', autoResize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    function addMessage(role, content, reasoning = null) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'assistant' ? 'K' : 'U';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      if (role === 'assistant') {
        const markdownDiv = document.createElement('div');
        markdownDiv.className = 'markdown-content';
        markdownDiv.innerHTML = marked.parse(content);
        contentDiv.appendChild(markdownDiv);
        
        if (reasoning) {
          const toggle = document.createElement('div');
          toggle.className = 'reasoning-toggle';
          toggle.innerHTML = '▼ <span>Show reasoning</span>';
          const reasoningDiv = document.createElement('div');
          reasoningDiv.className = 'reasoning';
          reasoningDiv.style.display = 'none';
          reasoningDiv.textContent = reasoning;
          toggle.addEventListener('click', () => {
            const isHidden = reasoningDiv.style.display === 'none';
            reasoningDiv.style.display = isHidden ? 'block' : 'none';
            toggle.innerHTML = `${isHidden ? '▲' : '▼'} <span>${isHidden ? 'Hide' : 'Show'} reasoning</span>`;
          });
          contentDiv.appendChild(toggle);
          contentDiv.appendChild(reasoningDiv);
        }
      } else {
        contentDiv.textContent = content;
      }
      
      div.appendChild(avatar);
      div.appendChild(contentDiv);
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function showError(msg) {
      const toast = document.createElement('div');
      toast.className = 'error-toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function setLoading(loading) {
      isLoading = loading;
      sendBtn.disabled = loading;
      input.disabled = loading;
      if (loading) {
        sendBtn.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
      } else {
        sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || isLoading) return;
      
      input.value = '';
      autoResize();
      setLoading(true);
      
      addMessage('user', text);
      messages.push({ role: 'user', content: text });
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: MODEL,
            messages: messages,
            reasoning: { enabled: true },
            max_tokens: 2000,
          }),
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }
        
        const choice = data.choices[0];
        const content = choice.message.content || '';
        const reasoning = choice.message.reasoning || '';
        const reasoningDetails = choice.message.reasoning_details;
        
        let fullReasoning = reasoning;
        if (reasoningDetails && reasoningDetails.length) {
          fullReasoning = reasoningDetails.map(d => d.text).join('\n\n');
        }
        
        const msgDiv = addMessage('assistant', content, fullReasoning);
        
        messages.push({
          role: 'assistant',
          content: content,
          reasoning_details: choice.message.reasoning_details,
        });
        
      } catch (err) {
        showError(err.message);
        // Remove the user message on error
        messages.pop();
        chatContainer.lastChild?.remove();
      } finally {
        setLoading(false);
      }
    }

    // Load marked.js for markdown rendering
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
    script.onload = () => {
      marked.setOptions({ breaks: true, gfm: true });
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
